services:
  backend:
    build:
      context: .
      target: backend
    working_dir: /app
    command: node index.js
    env_file:
      - server/.env
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      # 后端连接池建连超时 15s：health 响应可能被数据库慢连拖到 15s，wget 超时必须更大，
      # 否则数据库慢/挂时会导致容器被误判不健康、nginx 依赖阻塞不启动
      timeout: 20s
      retries: 3

  nginx:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
